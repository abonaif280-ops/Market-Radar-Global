# الحالات الميدانية: فحص الكود والاختبارات، وبناء أندرويد و iOS للتحقق من الكود الأصلي.
# لا يرفع التطبيق لأي متجر ولا يستخدم أي أسرار.
name: field_cases_app

on:
  push:
    paths:
      - "field_cases_app/**"
      - ".github/workflows/field_cases_app.yml"
  pull_request:
    paths:
      - "field_cases_app/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: field_cases_app

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # بدون key.properties يُوقَّع بمفتاح التطوير: صالح للتجربة فقط وليس للتوزيع.
      - run: flutter build apk --release
      - name: Verify the APK has no INTERNET permission
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::INTERNET permission found in the release APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: field-cases-android-test-apk
          path: field_cases_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # تجميع Swift والتحقق من الإعدادات دون توقيع (التوقيع يتم على Mac الجهة).
      - run: flutter build ios --release --no-codesign

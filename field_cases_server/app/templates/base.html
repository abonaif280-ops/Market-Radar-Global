<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}الحالات الميدانية{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">الحالات الميدانية</a>
    <nav>
      <a href="/">الرئيسية</a>
      {% if user.role == Role.ADMIN %}<a href="/users">المستخدمون</a>{% endif %}
      <a href="/account/password">كلمة المرور</a>
    </nav>
    <div class="who">
      <span>{{ user.full_name }} <small>({{ user.role_label }})</small></span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link" type="submit">خروج</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% if message %}<div class="alert success" role="status">{{ message }}</div>{% endif %}
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

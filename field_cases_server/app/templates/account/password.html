{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>تغيير كلمة المرور</h1>
  {% if user.must_change_password %}
  <p class="alert info">يجب تغيير كلمة المرور المؤقتة قبل المتابعة.</p>
  {% endif %}
  <form method="post" action="/account/password" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>كلمة المرور الحالية
      <input name="current_password" type="password" required dir="ltr">
    </label>
    <label>كلمة المرور الجديدة
      <input name="new_password" type="password" required dir="ltr" minlength="10">
      <small class="muted">10 أحرف على الأقل، حروف وأرقام، ولا تحتوي اسم المستخدم.</small>
    </label>
    <label>تأكيد كلمة المرور الجديدة
      <input name="confirm_password" type="password" required dir="ltr" minlength="10">
    </label>
    <button class="primary" type="submit">حفظ</button>
  </form>
</section>
{% endblock %}

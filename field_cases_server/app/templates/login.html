{% extends "base.html" %}
{% block title %}تسجيل الدخول — الحالات الميدانية{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>الحالات الميدانية</h1>
  <p class="muted">سجّل الدخول باسم المستخدم وكلمة المرور.</p>
  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
    <label>اسم المستخدم
      <input name="username" value="{{ username }}" required autofocus dir="ltr" maxlength="64">
    </label>
    <label>كلمة المرور
      <input name="password" type="password" required dir="ltr" maxlength="256">
    </label>
    <button class="primary" type="submit">دخول</button>
  </form>
</section>
{% endblock %}

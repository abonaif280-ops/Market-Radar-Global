; انسخ هذا الملف باسم config.ini واملأ القيم.
; config.ini يحتوي كلمة مرور قاعدة البيانات: اجعل صلاحية قراءته لحساب الخدمة ومدير النظام فقط.

[server]
; 0.0.0.0 = يقبل الاتصال من الأجهزة الأخرى في الشبكة. 127.0.0.1 = من السيرفر نفسه فقط.
host = 0.0.0.0
; رقم المنفذ للدخول من الأجهزة الأخرى: http://اسم-السيرفر:8080
port = 8080
; HTTPS (مستحسن): مسار شهادة الجهة ومفتاحها بصيغة PEM. اتركهما فارغين للعمل بـ HTTP.
tls_cert_file =
tls_key_file =
; مجلد صور الحالات على السيرفر (يُنسخ احتياطيًا مع قاعدة البيانات).
; data_dir = D:\FieldCasesData

[database]
; PostgreSQL:
; url = postgresql+psycopg://field_cases:CHANGE_ME@db-server:5432/field_cases
; SQL Server بحساب SQL:
; url = mssql+pyodbc://field_cases:CHANGE_ME@db-server:1433/field_cases?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
; SQL Server بحساب Windows للخدمة:
; url = mssql+pyodbc://@db-server/field_cases?driver=ODBC+Driver+18+for+SQL+Server&trusted_connection=yes&TrustServerCertificate=yes
url =

[security]
; إنهاء الجلسة بعد عدم النشاط (دقائق)، وأقصى مدة للجلسة (ساعات).
session_idle_minutes = 30
session_max_hours = 12
; قفل الحساب مؤقتًا بعد عدد محاولات خاطئة.
max_login_attempts = 5
lockout_minutes = 15

[app]
; المنطقة الزمنية لأوقات البلاغات وأرقام الحالات.
timezone = Asia/Riyadh

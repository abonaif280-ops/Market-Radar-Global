[alembic]
script_location = %(here)s/migrations
# رابط القاعدة يُقرأ من config.ini أو FC_DATABASE_URL (انظر migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s

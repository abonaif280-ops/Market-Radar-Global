[alembic]
script_location = %(here)s/migrations
# Database URL comes from config.ini or FC_DATABASE_URL (see migrations/env.py).
# Keep this file ASCII-only: Alembic reads it with the system locale on Windows.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s

{% extends "base.html" %}
{% block header %}<header><h1>أداة الجرد</h1><a href="{{ url_for('index') }}">↩ العودة للأداة</a></header>{% endblock %}
{% block body %}
<div class="card" style="max-width:480px;margin:20px auto">
 <h2>تغيير كلمة المرور — {{ u.username }}</h2>
 {% if u.default_pw %}<div class="warn">⚠ أنت تستخدم كلمة المرور الافتراضية. غيّرها الآن لحماية البيانات.</div>{% endif %}
 <form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>كلمة المرور الحالية<input name="old" type="password" autocomplete="current-password" required dir="ltr"></label>
  <label>كلمة المرور الجديدة (6 أحرف على الأقل)<input name="new" type="password" autocomplete="new-password" minlength="6" required dir="ltr"></label>
  <label>تأكيد كلمة المرور الجديدة<input name="new2" type="password" autocomplete="new-password" minlength="6" required dir="ltr"></label>
  <button class="pri" style="width:100%">💾 حفظ</button>
 </form>
</div>
{% endblock %}

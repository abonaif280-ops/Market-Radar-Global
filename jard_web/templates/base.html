<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>أداة الجرد</title>
<style>
:root{color-scheme:light;--pri:#123a63;--line:#9aa4b2}
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;color:#000;font-family:Tahoma,"Segoe UI","DejaVu Sans",Arial,sans-serif;font-size:18px;line-height:1.7;font-weight:600}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px}
header a{color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:8px;font-size:16px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:21px;color:var(--pri)}
label{display:flex;flex-direction:column;gap:5px;font-size:16.5px;font-weight:700;margin-bottom:12px}
input,select{font:inherit;font-size:19px;padding:11px 12px;border:2px solid #8a95a5;border-radius:8px;background:#fff;color:#000;width:100%}
input:focus,select:focus{outline:3px solid #ffbf47;border-color:var(--pri)}
button,.btn{font:inherit;font-size:17px;font-weight:700;padding:10px 16px;border-radius:8px;border:2px solid #8a95a5;background:#fff;color:#000;cursor:pointer;text-decoration:none;display:inline-block}
.pri{background:var(--pri)!important;border-color:var(--pri)!important;color:#fff!important}
.dan{color:#9b0d0d;border-color:#9b0d0d}
.sm{font-size:15px;padding:6px 10px}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;border:2px solid}
.msg.err{background:#fbd3cf;border-color:#9b0d0d}.msg.ok{background:#cdeed7;border-color:#0b5d24}
.warn{background:#fff3c4;border:2px solid #b07a00;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
table{width:100%;border-collapse:collapse;font-size:16px}
th{background:var(--pri);color:#fff;padding:9px 6px}
td{border-bottom:1.5px solid var(--line);padding:8px 6px;vertical-align:middle;text-align:center}
td input,td select{font-size:16px;padding:7px 8px}
.off{opacity:.55}
.badge{padding:2px 10px;border-radius:12px;font-size:14px;background:#e3e7ec}
.badge.a{background:#123a63;color:#fff}.badge.c{background:#cdeed7}
.muted{color:#222;font-size:15.5px}
@media (max-width:760px){table,tbody,tr,td{display:block;width:100%}thead{display:none}tr{border:1.5px solid var(--line);border-radius:10px;margin-bottom:12px;padding:8px;background:#fff}td{border:0;text-align:right}td::before{content:attr(data-l);display:block;font-size:14px;color:#333}}
</style>
</head>
<body>
{% block header %}{% endblock %}
<main>
{% with ms = get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="msg {{c}}">{{m}}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>

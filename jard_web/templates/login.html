{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:440px;margin:40px auto">
 <h2 style="text-align:center;font-size:26px">أداة الجرد</h2>
 <form method="post" autocomplete="on">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>اسم المستخدم<input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus dir="ltr"></label>
  <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
  <button class="pri" style="width:100%;font-size:20px;padding:13px">دخول</button>
 </form>
</div>
{% endblock %}
